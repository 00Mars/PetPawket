<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Pet Pawket</title>

  <!-- Core Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/globals.css" />
  <link rel="stylesheet" href="/css/core.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet" />

  
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Content Area -->
  <div class="page-container">
    <div class="contact-wrapper">
      <h1>How can we help you?</h1>

      <label for="contactType">Select a reason for contacting us:</label>
      <select id="contactType">
        <option value="">-- Choose One --</option>
        <option value="general">General Contact</option>
        <option value="order-tracker">Order Tracking</option>
        <option value="partner">Partner / Product Submission</option>
      </select>

      <div id="formContainer" class="form-section"></div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script type="module">
    import { injectNavbar } from './navbar.js';
    import { injectFooter } from './footer.js';
    import { setupHueyAnimation } from './navbarAnimation.js';
    import { setupNavbarOverlayHandlers } from './navbarOverlay.js';
    

    injectNavbar(() => {
  setupNavbarOverlayHandlers();
  setupHueyAnimation();
});
    injectFooter();

    const formContainer = document.getElementById('formContainer');
    const contactType = document.getElementById('contactType');

    const forms = {
      general: `
        <form id="generalForm">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      `,
      'order-tracker': `
        <form id="orderTrackerFormInline">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <input type="text" name="orderNumber" placeholder="Order Number" required />
          <textarea name="message" rows="4" placeholder="Anything else we should know?" required></textarea>
          <button type="submit">Request Order Help</button>
        </form>
      `,
      partner: `
        <form id="partnerForm">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="text" name="company" placeholder="Company Name (Optional)" />
          <input type="email" name="email" placeholder="Your Email" required />
          <input type="url" name="website" placeholder="Website / Portfolio" />
          <textarea name="description" rows="5" placeholder="Tell us about your products or idea" required></textarea>
          <button type="submit">Submit Proposal</button>
        </form>
      `
    };

    contactType.addEventListener('change', () => {
      const selected = contactType.value;
      formContainer.innerHTML = forms[selected] || '';

      const currentForm = formContainer.querySelector('form');
      if (currentForm) {
        currentForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const data = Object.fromEntries(new FormData(currentForm).entries());
          console.log(`Form Submitted (${selected})`, data);
          alert("Thank you! We'll be in touch soon.");
          currentForm.reset();
        });
      }
    });

    const params = new URLSearchParams(window.location.search);
    const topic = (params.get('topic') || '').toLowerCase();
    if (topic === 'order' || topic === 'order-tracker' || topic === 'track-order') {
      contactType.value = 'order-tracker';
      contactType.dispatchEvent(new Event('change'));
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
