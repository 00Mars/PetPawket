<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | Pet Pawket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/core.css" />
</head>
<body>
  <header id="navbar-container"></header>
  <main class="container py-4">
    <h1>Forgot Password</h1>
    <p>Enter your account email and we’ll send a reset link. If the email exists, you will receive instructions.</p>
    <form id="forgotForm" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required autocomplete="email" placeholder="you@example.com" title="Email address" />
      <button type="submit" class="btn btn-primary">Send reset link</button>
      <p id="forgotMsg" class="mt-2"></p>
      <div id="devResetLink"></div>
    </form>
  </main>
  <script type="module" src="/scripts/forgot-password.js"></script>
</body>
</html>
