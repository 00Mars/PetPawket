<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Portal | Pet Pawket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/globals.css" />
  <link rel="stylesheet" href="/css/core.css" />
  <link rel="stylesheet" href="/css/pawket-network.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>

  <main class="pp-network">
    <section class="pp-band pp-band--cool pp-network-section">
      <div class="pp-band-inner">
        <div class="pp-section-head">
          <span class="pp-kicker">Partner Portal</span>
          <h2>Manage your Pawket Network listing.</h2>
          <p>Claimed owners and managers can update profile details, services, FAQs, offers, and integration settings.</p>
        </div>

        <div class="pp-network-grid">
          <aside class="pp-network-panel">
            <h3>Your listings</h3>
            <div class="pp-network-queue" data-owner-listings></div>
          </aside>

          <section class="pp-network-panel">
            <h3>Listing editor</h3>
            <p class="pp-network-status" data-owner-status>Select a listing to edit.</p>

            <form data-owner-profile-form>
              <input class="pp-network-input" name="name" placeholder="Listing name" />
              <div class="pp-network-row">
                <input class="pp-network-input" name="city" placeholder="City" />
                <input class="pp-network-input" name="state" placeholder="State" maxlength="2" />
              </div>
              <input class="pp-network-input" name="postal_code" placeholder="ZIP" />
              <input class="pp-network-input" name="phone" placeholder="Phone" />
              <input class="pp-network-input" name="website_url" placeholder="Website URL (https://...)" />
              <textarea class="pp-network-textarea" name="short_description" placeholder="Short description"></textarea>
              <div class="pp-network-actions">
                <button class="pp-network-btn" type="submit">Save profile</button>
              </div>
            </form>

            <form data-owner-services-form>
              <div class="pp-network-item-head">
                <strong>Services</strong>
                <button class="pp-network-btn ghost pp-network-btn--sm" type="button" data-owner-add-service>Add service</button>
              </div>
              <div class="pp-network-queue" data-owner-services-rows></div>
              <div class="pp-network-actions">
                <button class="pp-network-btn ghost" type="submit">Save services</button>
              </div>
            </form>

            <form data-owner-faqs-form>
              <div class="pp-network-item-head">
                <strong>FAQs</strong>
                <button class="pp-network-btn ghost pp-network-btn--sm" type="button" data-owner-add-faq>Add FAQ</button>
              </div>
              <div class="pp-network-queue" data-owner-faqs-rows></div>
              <div class="pp-network-actions">
                <button class="pp-network-btn ghost" type="submit">Save FAQs</button>
              </div>
            </form>

            <form data-owner-offers-form>
              <div class="pp-network-item-head">
                <strong>Offers</strong>
                <button class="pp-network-btn ghost pp-network-btn--sm" type="button" data-owner-add-offer>Add offer</button>
              </div>
              <div class="pp-network-queue" data-owner-offers-rows></div>
              <div class="pp-network-actions">
                <button class="pp-network-btn ghost" type="submit">Save offers</button>
              </div>
            </form>

            <form data-owner-integration-form>
              <div class="pp-network-row">
                <select class="pp-network-select" name="portal_mode">
                  <option value="internal_profile">Internal profile</option>
                  <option value="external_site">External site</option>
                </select>
                <select class="pp-network-select" name="lead_destination">
                  <option value="email">Email</option>
                  <option value="webhook">Webhook</option>
                  <option value="both">Both</option>
                </select>
              </div>
              <input class="pp-network-input" name="external_site_url" placeholder="External URL (https://...)" />
              <input class="pp-network-input" name="lead_email" placeholder="Lead email" />
              <input class="pp-network-input" name="lead_webhook_url" placeholder="Lead webhook URL (https://...)" />
              <label><input type="checkbox" name="enable_lead_form" /> Enable lead form</label>
              <label><input type="checkbox" name="enable_offers" /> Enable offers</label>
              <button class="pp-network-btn ghost" type="submit">Save integration</button>
            </form>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>
  <script type="module" src="/main.js"></script>
  <script type="module" src="/partnerPortal.js"></script>
</body>
</html>
