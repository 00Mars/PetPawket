<header class="pp-header">
  <!-- topline -->
  <div class="pp-topline">
    New Customers: 10% off $20 or more with code WELCOME10
  </div>

  <!-- main teal bar -->
  <nav class="pp-nav" aria-label="Primary">
    <div class="pp-nav-inner">
      <!-- LEFT RAIL -->
      <div class="pp-nav-left">
        <button class="pp-icon-btn" type="button" data-pp="search" aria-label="Search">
          <i class="bi bi-search"></i>
        </button>

        <div class="pp-dropdown">
          <button class="pp-icon-btn" type="button" aria-label="Account" data-action="open-account">
            <i class="bi bi-person-circle"></i>
          </button>
          <!-- host for account menu (JS can fill this) -->
          <div class="dropdown-menu icon-dropdown-menu dropdown-menu-end p-0 shadow" hidden></div>
        </div>

        <div class="pp-dropdown">
          <button
            class="pp-icon-btn"
            type="button"
            aria-label="Wishlist"
            id="nav-wish-toggle"
            aria-controls="pp-wish-menu"
          >
            <i class="bi bi-heart"></i>
          </button>
          <div
            id="pp-wish-menu"
            class="dropdown-menu icon-dropdown-menu dropdown-menu-end p-0 shadow"
            role="menu"
            aria-labelledby="nav-wish-toggle"
            hidden
          >
            <div class="p-3 text-muted small">Loading…</div>
          </div>
        </div>
      </div>

      <!-- CENTER / BRAND -->
      <div class="pp-nav-center">
        <div class="pp-brand">
          <div class="pp-brand-frame" id="pp-logo-frame">
            <img src="/PP_Frame.svg" alt="" class="pp-brand-ring">
            <img
              src="/Huey.svg"
              alt="Pet Pawket"
              class="pp-brand-head huey-mascot"
              id="huey"
            >
          </div>
          <a href="/.." class="pp-brand-text">Pet Pawket</a>
        </div>
      </div>

      <!-- RIGHT RAIL -->
      <div class="pp-nav-right">
        <div class="pp-dropdown" id="nav-cart">
          <button
            class="pp-icon-btn"
            type="button"
            aria-label="Cart"
            id="nav-cart-toggle"
            aria-controls="cart-menu"
          >
            <i class="bi bi-cart3"></i>
          </button>
          <div
            id="cart-menu"
            class="dropdown-menu icon-dropdown-menu dropdown-menu-end p-0 shadow"
            role="menu"
            aria-labelledby="nav-cart-toggle"
            hidden
          ></div>
        </div>

        <div class="pp-dropdown" id="nav-orders">
          <button
            class="pp-icon-btn"
            type="button"
            aria-label="Orders"
            id="nav-orders-toggle"
            aria-controls="orders-menu"
          >
            <i class="bi bi-truck"></i>
          </button>
          <div
            id="orders-menu"
            class="dropdown-menu icon-dropdown-menu dropdown-menu-end"
            role="menu"
            aria-labelledby="nav-orders-toggle"
            hidden
          >
            <button type="button" class="dropdown-item" data-toggle="order-tracker-modal">Track Order</button>
          </div>
        </div>

        <a href="/cart.html" class="pp-cart-pill" aria-label="Items in cart">
          <span id="cart-count" aria-live="polite">0</span>
        </a>
      </div>
    </div>
  </nav>
</header>

<!-- search overlay: keep the legacy id the JS already wires to -->
<div id="searchOverlay" class="search-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="searchLabel">
  <div class="search-card" role="document">
    <div class="search-head">
      <div class="input-wrap">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input id="searchInput" type="text" placeholder="Search your pets, journal &amp; products…" aria-label="Search" />
      </div>
      <div class="search-hints">
        <span class="d-none d-md-inline">Press</span><span class="kbd">/</span><span class="d-none d-md-inline">or</span><span class="kbd">⌘K</span>
        <button id="searchCloseBtn" class="search-close" title="Close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="search-tools">
      <select id="searchCategory" aria-label="Category">
        <option value="all" selected>All Categories</option>
        <option value="products">Products</option>
        <option value="pets">Pets</option>
        <option value="journal">Journal</option>
      </select>
      <button id="searchGo" type="button">Search</button>
    </div>
    <div class="search-results" id="searchResults" role="listbox" aria-live="polite"></div>
  </div>
</div>

<!-- modals (keep ids so navbarModals.js/auth.js can find them) -->
<div id="loginModal" class="custom-modal hidden" role="dialog" aria-modal="true" aria-labelledby="loginHeading">
  <div class="modal-content">
    <h3 id="loginHeading">Log In</h3>
    <form id="loginForm" autocomplete="on">
      <input type="email" name="email" placeholder="Email" required autocomplete="username" spellcheck="false" />
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" class="btn btn-primary">Continue</button>
    </form>
    <button class="close-btn" data-close="loginModal" aria-label="Close login modal">×</button>
  </div>
</div>

<div id="signupModal" class="custom-modal hidden" role="dialog" aria-modal="true" aria-labelledby="signupHeading">
  <div class="modal-content">
    <h3 id="signupHeading">Create an Account</h3>
    <form id="signupForm" autocomplete="on">
      <input type="text"  name="firstName"       placeholder="First Name"  required />
      <input type="text"  name="lastName"        placeholder="Last Name"   required />
      <input type="email" name="email"           placeholder="Email"       required />
      <div class="password-wrapper">
        <input type="password" name="password"        placeholder="Password"         required />
        <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
      </div>
      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
    <button class="close-btn" data-close="signupModal" aria-label="Close signup modal">×</button>
  </div>
</div>

<div id="orderTrackerModal" class="custom-modal hidden" role="dialog" aria-modal="true" aria-labelledby="orderTrackHeading">
  <div class="modal-content">
    <h3 id="orderTrackHeading">Track Your Order</h3>
    <form id="orderTrackerForm" autocomplete="on">
      <input type="email" placeholder="Your Email" required />
      <input type="text"  placeholder="Order Number" required />
      <button type="submit" class="btn btn-primary">Track</button>
    </form>
    <button class="close-btn" data-close="orderTrackerModal" aria-label="Close order tracking modal">×</button>
  </div>
</div>
