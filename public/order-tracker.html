<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Order | Pet Pawket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/globals.css" />
  <link rel="stylesheet" href="/css/core.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>

  <div class="page-container">
    <div class="contact-wrapper">
      <h1>Track Your Order</h1>
      <p>Enter your order number and email and we’ll surface the latest status.</p>

      <form id="orderTrackerPageForm" autocomplete="on">
        <input type="email" name="email" placeholder="Email" required />
        <input type="text" name="orderNumber" placeholder="Order Number" required />
        <input type="text" name="postal" placeholder="ZIP / Postal Code (Optional)" />
        <button type="submit">Check Status</button>
      </form>

      <div id="orderTrackerResult" class="mt-3" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script type="module">
    import { injectNavbar } from './navbar.js';
    import { injectFooter } from './footer.js';
    import { setupHueyAnimation } from './navbarAnimation.js';
    import { setupNavbarOverlayHandlers } from './navbarOverlay.js';

    injectNavbar(() => {
      setupNavbarOverlayHandlers();
      setupHueyAnimation();
    });
    injectFooter();

    const form = document.getElementById('orderTrackerPageForm');
    const result = document.getElementById('orderTrackerResult');

    form?.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      result.textContent = `Thanks! We’ll send updates to ${data.email || 'your email'} shortly.`;
      form.reset();
    });
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
