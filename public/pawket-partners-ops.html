<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawket Partners Ops | Pet Pawket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/globals.css" />
  <link rel="stylesheet" href="/css/core.css" />
  <link rel="stylesheet" href="/css/pawket-network.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>

  <main class="pp-network">
    <section class="pp-band pp-band--play pp-network-section">
      <div class="pp-band-inner">
        <div class="pp-section-head">
          <span class="pp-kicker">Pawket Partners Ops</span>
          <h2>Review claims and manage partner readiness.</h2>
          <p>This portal is dedicated to Pawket Network operations only. It is separate from broader site administration.</p>
        </div>

        <div class="pp-network-grid">
          <aside class="pp-network-panel">
            <h3>Claim queue</h3>
            <div class="pp-network-actions">
              <button class="pp-network-btn" type="button" data-ops-action="refresh">Refresh</button>
              <select class="pp-network-select" data-ops-claim-status>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
            <div class="pp-network-chip-row" data-ops-claim-summary></div>
            <p class="pp-network-status" data-ops-status></p>
            <div class="pp-network-queue" data-ops-claims></div>
          </aside>

          <section class="pp-network-panel">
            <h3>Listings</h3>
            <div class="pp-network-queue" data-ops-listings></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>
  <script type="module" src="/main.js"></script>
  <script type="module" src="/pawketPartnersOps.js"></script>
</body>
</html>
