<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | Pet Pawket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/core.css" />
</head>
<body>
  <header id="navbar-container"></header>
  <main class="container py-4">
    <h1>Reset Password</h1>
    <form id="resetForm" autocomplete="off">
      <label for="password">New Password</label>
      <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Enter new password" title="Enter a new password (minimum 8 characters)" />
      <label for="confirm">Confirm New Password</label>
      <input id="confirm" type="password" name="confirm" required minlength="8" autocomplete="new-password" placeholder="Confirm new password" title="Confirm the new password (must match)" />
      <button type="submit" class="btn btn-primary">Reset Password</button>
      <p id="resetMsg" class="mt-2"></p>
    </form>
  </main>
  <script type="module" src="/scripts/reset-password.js"></script>
</body>
</html>
