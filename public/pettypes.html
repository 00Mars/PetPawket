<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Types | Pet Pawket</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/globals.css" />
  <link rel="stylesheet" href="/css/core.css" />
  <link rel="stylesheet" href="/css/pettypes.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>

  <div class="page-container">
    <div class="content-wrapper">
      <h1>Pet Types</h1>
      <p>Pick a pet type to filter the shop and see tailored picks right away.</p>
    </div>

    <div id="pettypes-container" data-shop-path="/shop.html"></div>

    <div class="content-wrapper">
      <p>Looking for something more specific? Jump straight to Packs, Packets, Picks, or the full shop.</p>
      <div class="pp-cta-row">
        <a class="pp-impact-btn" href="/packs.html">Explore Pawket Packs</a>
        <a class="pp-ghost-btn" href="/shop.html">Open Shop</a>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script type="module">
    import { injectNavbar } from './navbar.js';
    import { injectFooter } from './footer.js';
    import { setupHueyAnimation } from './navbarAnimation.js';
    import { setupNavbarOverlayHandlers } from './navbarOverlay.js';
    import { injectPetTypes } from './pettypes.js';

    injectNavbar(() => {
      setupNavbarOverlayHandlers();
      setupHueyAnimation();
    });
    injectFooter();
    injectPetTypes();
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
