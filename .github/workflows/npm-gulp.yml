name: Pet Pawket CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  root:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Check key JavaScript entry points
        run: |
          node --check server.js
          node --check routes/networkRoutes.js
          node --check routes/palRoutes.js
          node --check routes/petsRoutes.js
          node --check public/account.js
          node --check public/pals.js
          node --check public/pawketNetwork.js
          node --check public/storyHub.js

      - name: Run root tests
        run: npm test

      - name: Lint CSS
        run: npm run lint:css

  pawket-pals-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: apps/pawketpals/package-lock.json

      - name: Install Pawket Pals app dependencies
        working-directory: apps/pawketpals
        run: npm ci

      - name: Typecheck Pawket Pals app
        working-directory: apps/pawketpals
        run: npx tsc --noEmit
